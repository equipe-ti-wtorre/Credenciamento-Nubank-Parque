<div class="two step-dados">
  <div class="step-dados__cal">
    <label class="field__label">Período</label>
    <app-evento-calendar
      mode="range"
      [rangeStart]="dataInicio()"
      [rangeEnd]="dataFim()"
      [picking]="picking()"
      [initialMonth]="dataInicio() || null"
      [viewKey]="calViewKey()"
      (dayClick)="rangePick.emit($event)"
    />
    <div class="period">
      <div class="period__box">
        <small>Início</small>
        <span [class.empty]="!dataInicio()">{{ startLabel() }}</span>
      </div>
      <div class="period__box">
        <small>Término</small>
        <span [class.empty]="!dataFim()">{{ endLabel() }}</span>
      </div>
    </div>
  </div>

  <div class="step-dados__fields">
    <div class="field">
      <label class="field__label" for="nev-nome">Nome</label>
      <input
        id="nev-nome"
        class="input"
        [class.input--filled]="!!nome().trim()"
        [ngModel]="nome()"
        (ngModelChange)="nome.set($event)"
        placeholder="Ex.: Show de aniversário"
        autocomplete="off"
      />
    </div>
    <div class="fields-row">
      <div class="field">
        <label class="field__label" for="nev-empresa">Empresa responsável</label>
        <select
          id="nev-empresa"
          class="select"
          [ngModel]="idEmpresa()"
          (ngModelChange)="idEmpresa.set($event)"
          [disabled]="lockEmpresa()"
        >
          <option [ngValue]="null" disabled>Selecione a produtora</option>
          @for (p of producers(); track p.id_company) {
            <option [ngValue]="p.id_company">{{ p.company_name }}</option>
          }
        </select>
      </div>
      <div class="field">
        <label class="field__label" for="nev-setor">Time aprovador</label>
        <select
          id="nev-setor"
          class="select"
          [ngModel]="idSetor()"
          (ngModelChange)="idSetor.set($event)"
        >
          <option [ngValue]="null" disabled>Selecione o time</option>
          @for (s of sectors(); track s.id) {
            <option [ngValue]="s.id">{{ s.nome }}</option>
          }
        </select>
      </div>
    </div>
    <div class="field">
      <span class="field__label">Foto do evento</span>
      <p class="field__help">Identifica o evento na lista. JPEG, PNG ou WebP, até 2 MB.</p>
      <div class="wcrt-cover">
        <div class="wcrt-cover__preview" [class.empty]="!coverPreview()">
          @if (coverPreview()) {
            <img [src]="coverPreview()" alt="Prévia da capa" />
          } @else {
            <span>Sem foto</span>
          }
        </div>
        <div class="wcrt-cover__actions">
          <label class="wcrt-cover__pick">
            <input type="file" accept="image/jpeg,image/png,image/webp" (change)="coverPick.emit($event)" />
            {{ coverPreview() ? 'Trocar foto' : 'Escolher foto' }}
          </label>
          @if (coverPreview()) {
            <button type="button" class="wcrt-cover__clear" (click)="coverClear.emit()">Remover</button>
          }
        </div>
      </div>
    </div>
  </div>
</div>
