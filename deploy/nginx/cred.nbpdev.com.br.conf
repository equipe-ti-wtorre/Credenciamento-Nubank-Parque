# MODELO — a TI aplica no aaPanel. Este arquivo NÃO é o vhost ativo.
# Site: cred.nbpdev.com.br
# Root da SPA: /www/wwwroot/Credenciamento/frontend/dist-prod
#
# Ao colar no aaPanel:
#   - preserve os caminhos de certificado que o painel já gerencia;
#   - NÃO apague a allowlist de /api/facial/* (ver docs/nginx-facial-allowlist.conf.example);
#   - TLS só 1.2/1.3; remova TLSv1.1 e cifras 3DES/RSA+3DES.
#
# Desvio temporário (até a Fase 2 do roteiro de auditoria):
#   connect-src inclui https://login.microsoftonline.com porque o MSAL ainda está no front.

server {
    listen 80;
    listen 443 ssl http2;
    server_name cred.nbpdev.com.br;

    root /www/wwwroot/Credenciamento/frontend/dist-prod;
    index index.html;

    ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_certificate     /www/server/panel/vhost/cert/cred.nbpdev.com.br/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/cred.nbpdev.com.br/privkey.pem;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://auth.nbpdev.com.br https://login.microsoftonline.com; frame-ancestors 'self' https://teams.microsoft.com https://*.teams.microsoft.com; object-src 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API do backend (PM2 na 3007). Manter /api/facial/* com allowlist no vhost atual.
    # Ver docs/nginx-facial-allowlist.conf.example — location = exato, não prefixo em /api/facial/status.
    location /api/ {
        proxy_pass http://127.0.0.1:3007/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://auth.nbpdev.com.br https://login.microsoftonline.com; frame-ancestors 'self' https://teams.microsoft.com https://*.teams.microsoft.com; object-src 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://auth.nbpdev.com.br https://login.microsoftonline.com; frame-ancestors 'self' https://teams.microsoft.com https://*.teams.microsoft.com; object-src 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
