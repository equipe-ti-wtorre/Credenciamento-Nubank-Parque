# Cópia da config em uso no AZURE-WEB03 (/www/server/panel/vhost/nginx/cred.nbpdev.com.br.conf), 18/11/2026.
# Editada fora do aaPanel: se o painel regravar o site, reaplicar a partir deste arquivo.
server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name cred.nbpdev.com.br;
    index index.php index.html index.htm default.php default.htm default.html;
    #root /www/wwwroot/Credenciamento/frontend/dist/frontend/browser;
    root /www/wwwroot/Credenciamento/frontend/dist-prod;
    include /www/server/panel/vhost/nginx/extension/cred.nbpdev.com.br/*.conf;

    #SSL-START SSL related configuration, do NOT delete or modify the next line of commented-out 404 rules
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/cred.nbpdev.com.br/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/cred.nbpdev.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    # CSP aplicada: só o que não depende de script inline (iframe só no próprio site e no Teams).
    add_header Content-Security-Policy "frame-ancestors 'self' https://teams.microsoft.com https://*.teams.microsoft.com https://teams.cloud.microsoft https://*.cloud.microsoft https://*.office.com https://*.microsoft365.com https://*.skype.com; object-src 'none'; base-uri 'self'" always;
    # CSP completa em observação: violações aparecem no console do navegador, nada é bloqueado.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://auth.nbpdev.com.br https://login.microsoftonline.com https://graph.microsoft.com https://res.cdn.office.net; frame-src 'self' https://login.microsoftonline.com; worker-src 'self' blob:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    quic_retry on;
    quic_gso on;
    # 0-RTT desligado: permitiria reenviar POST da API.
    ssl_early_data off;
    error_page 497  https://$host$request_uri;
    #SSL-END

    #ERROR-PAGE-START  Error page configuration, allowed to be commented, deleted or modified
    error_page 404 /404.html;
    error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP reference configuration, allowed to be commented, deleted or modified
    include enable-php-00.conf;
    #PHP-INFO-END

    #REWRITE-START URL rewrite rule reference, any modification will invalidate the rewrite rules set by the panel
    include /www/server/panel/vhost/rewrite/cred.nbpdev.com.br.conf;
    #REWRITE-END
    
    
    # ^~: as regras de arquivo estático abaixo não podem capturar /api/... (ex.: fotos .jpg)
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3007/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # Front publicado como build estático (deploy/build-front.sh); rotas do Angular caem no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Cache: `expires` (e não add_header) mantém os cabeçalhos de segurança do server.
    # Arquivo com hash no nome (build do Angular): 1 ano.
    location ~* "-[A-Z0-9]{8}\.(js|css|woff2?)$" {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }
    # HTML e JS/CSS sem hash (index, /auth/teams*, vendor): sempre revalida.
    location ~* \.(html|js|css)$ {
        expires epoch;
        try_files $uri =404;
    }
    location ~* \.(woff2?|png|jpe?g|gif|svg|ico|webp|mp4)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # Forbidden files or directories
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md)
    {
        return 404;
    }

    # Directory verification related settings for one-click application for SSL certificate
    location ~ \.well-known{
        allow all;
    }

    #Prohibit putting sensitive files in certificate verification directory
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # Nao cachear js/css/imagens no disco: o ng serve gera esses arquivos em memoria.
    # Location regex tem prioridade sobre "location /" e quebrava o proxy (pagina em branco).
    #location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    #{
    #    expires      30d;
    #    error_log /dev/null;
    #    access_log /dev/null;
    #}

    #location ~ .*\.(js|css)?$
    #{
    #    expires      12h;
    #    error_log /dev/null;
    #    access_log /dev/null; 
    #}

    access_log  /www/wwwlogs/cred.nbpdev.com.br.log;
    error_log  /www/wwwlogs/cred.nbpdev.com.br.error.log;
}
